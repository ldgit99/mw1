<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Block Survivor Mission</title>
    <style>
      :root {
        --ui: #d6c7a2;
        --ui-dark: #2a2119;
        --hp: #ff5a5f;
        --ok: #7ddc74;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          linear-gradient(180deg, #9fd4ff 0 42%, #90c66d 42% 60%, #6f4e37 60% 100%);
        color: var(--ui-dark);
        font-family: "Courier New", "Lucida Console", monospace;
      }

      .game-shell {
        position: relative;
        width: min(99vw, 1340px);
        background: #2b2218;
        border: 6px solid #181109;
        box-shadow: 0 0 0 4px #5a432f;
        padding: 10px;
      }

      #hud {
        display: grid;
        grid-template-columns: repeat(8, 1fr);
        gap: 8px;
        margin-bottom: 8px;
      }

      .stat {
        background: var(--ui);
        border: 3px solid #56402a;
        padding: 6px 8px;
        font-size: 13px;
      }

      .stat strong {
        float: right;
      }

      #hp { color: var(--hp); }
      #boss-hp { color: #156cc3; }
      #bombs { color: #8a2be2; }
      #missiles { color: #ff7f32; }
      #shield { color: #25a5d1; }

      #status {
        margin-bottom: 8px;
        padding: 6px 8px;
        border: 3px solid #56402a;
        background: #e8ddb9;
        font-size: 13px;
      }

      #controls {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        margin-bottom: 8px;
        align-items: center;
      }

      .ctrl-btn {
        border: 2px solid #3f2d1c;
        background: #d8c492;
        color: #2a2119;
        font-family: inherit;
        font-size: 12px;
        padding: 6px 10px;
        cursor: pointer;
      }

      .ctrl-btn:hover { background: #e5d2a6; }

      #stage-buttons { display: contents; }

      .audio-box {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 6px 8px;
        background: #e8ddb9;
        border: 2px solid #56402a;
        font-size: 12px;
      }

      #game {
        width: 100%;
        aspect-ratio: 16 / 9;
        display: block;
        border: 4px solid #15100c;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        cursor: crosshair;
      }

      #help {
        margin-top: 8px;
        color: #f2dfb2;
        font-size: 12px;
        letter-spacing: 0.2px;
      }

      .ok { color: var(--ok); }

      .overlay {
        position: absolute;
        inset: 0;
        display: none;
        place-items: center;
        background: rgba(10, 8, 6, 0.55);
        z-index: 20;
      }

      .overlay.show { display: grid; }

      .panel {
        width: min(92%, 560px);
        padding: 16px;
        border: 4px solid #4e3826;
        background: #f0e4c8;
        color: #241b13;
      }

      .panel h2 {
        margin: 0 0 8px;
        font-size: 24px;
      }

      .panel p {
        margin: 4px 0;
        font-size: 14px;
      }

      .panel .ctrl-btn {
        margin-top: 10px;
      }
    </style>
  </head>
  <body>
    <main class="game-shell">
      <div id="hud">
        <div class="stat">HP <strong id="hp">100</strong></div>
        <div class="stat">STAGE <strong id="stage">1/10</strong></div>
        <div class="stat">STAGE KILLS <strong id="stage-kills">0/50</strong></div>
        <div class="stat">BOSS HP <strong id="boss-hp">10</strong></div>
        <div class="stat">BOMBS <strong id="bombs">3</strong></div>
        <div class="stat">MISSILES <strong id="missiles">2</strong></div>
        <div class="stat">SHIELD <strong id="shield">OFF</strong></div>
        <div class="stat">TOTAL KILLS <strong id="kills">0</strong></div>
      </div>
      <div id="status">STAGE 1 준비</div>
      <div id="controls">
        <button class="ctrl-btn" id="retry-btn" type="button">다시하기</button>
        <button class="ctrl-btn" id="pause-btn" type="button">일시정지</button>
        <div class="audio-box">
          <label><input type="checkbox" id="sound-toggle" checked /> 사운드</label>
          <label>볼륨 <input id="volume-slider" type="range" min="0" max="100" value="18" /></label>
        </div>
        <div id="stage-buttons"></div>
      </div>
      <canvas id="game" width="1280" height="720"></canvas>
      <div id="help">WASD 또는 방향키 이동 / 마우스 조준 / 좌클릭 사격 / 스페이스 자동조준 사격 / 1번 폭탄 / 2번 미사일 / 3번 방어막(10초) <span class="ok">MISSION: 10 스테이지 클리어 + 대왕 유령 처치</span></div>

      <div id="start-menu" class="overlay show">
        <div class="panel">
          <h2>게임 시작</h2>
          <p>최고 스테이지: <strong id="start-best-stage">1</strong></p>
          <p>누적 처치 수: <strong id="start-total-kills">0</strong></p>
          <button class="ctrl-btn" id="start-btn" type="button">START</button>
        </div>
      </div>

      <div id="pause-overlay" class="overlay">
        <div class="panel">
          <h2>일시정지</h2>
          <p>게임이 멈춘 상태입니다.</p>
          <button class="ctrl-btn" id="resume-btn" type="button">이어하기</button>
        </div>
      </div>

      <div id="gameover-overlay" class="overlay">
        <div class="panel">
          <h2>GAME OVER</h2>
          <p>현재 스테이지를 다시 시도할 수 있습니다.</p>
          <button class="ctrl-btn" id="restart-btn" type="button">현재 스테이지 재시작</button>
        </div>
      </div>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
